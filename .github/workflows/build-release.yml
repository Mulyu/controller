name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # :core is a plain-Kotlin module with no Android dependency -- the pad
      # state -> uinput event translation logic lives here and is fully
      # covered by unit tests.
      - name: Run :core unit tests
        run: ./gradlew :core:test --stacktrace --no-daemon

      # :app (Shizuku glue, overlay service, UI) needs the Android SDK to
      # even compile, so this is the first point in the whole project this
      # module gets built at all.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poc-${{ github.run_number }}
          name: PoC build ${{ github.run_number }}
          generate_release_notes: true
          body: |
            Automated PoC build from `main` at ${{ github.sha }}.

            This is a debug-signed APK for manual testing only (Shizuku +
            uinput virtual gamepad PoC). See README.md for setup and known
            gaps before relying on it.
          files: dist/app-debug.apk
